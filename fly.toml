# fly launch --copy-config --no-deploy && fly volumes create data --size 5 && fly secrets set ANTHROPIC_API_KEY=... ADMIN_EMAIL=... ADMIN_PASSWORD=... && fly deploy
app = "joinco-sourcing-intelligence"
primary_region = "ams"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"
  ANTHROPIC_MODEL = "claude-opus-5-5"
  ANALYSIS_EFFORT = "low"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
