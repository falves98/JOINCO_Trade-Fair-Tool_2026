<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · JOINCO Sourcing Intelligence</title><meta name="theme-color" content="#C2440F"><link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,700&family=Public+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#EEF1F4;--surface:#fff;--ink:#13202C;--muted:#586674;--line:#D3DAE1;--accent:#C2440F;--accent-ink:#fff;--bad:#B42318}
@media (prefers-color-scheme:dark){:root{--bg:#0D1319;--surface:#151D25;--ink:#E6ECF1;--muted:#97A5B2;--line:#283442;--accent:#FF7B42;--accent-ink:#1A0A02;--bad:#FF8A80;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.45 "Public Sans",system-ui,sans-serif;padding:24px 16px}
form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
small{font:600 11px/1 ui-monospace,monospace;letter-spacing:.14em;color:var(--accent)}
h1{font:700 30px/1.1 "Archivo","Arial Narrow",sans-serif;font-stretch:85%;margin:0 0 8px}
label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input{font:inherit;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;min-height:50px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);min-height:52px;cursor:pointer}
#err{color:var(--bad);font-size:14px;min-height:1.2em;margin:0}
p.note{color:var(--muted);font-size:13px;margin:0}
</style></head><body>
<form id="f"><div><small>JOINCO</small><h1>Sourcing Intelligence</h1></div>
<label>Work email<input id="email" type="email" autocomplete="username" inputmode="email" required></label>
<label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
<button id="go">Sign in</button><p id="err" role="alert"></p>
<p class="note">Accounts are created by your JOINCO admin.</p></form>
<script>
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("go"),er=document.getElementById("err");b.disabled=true;er.textContent="";
try{const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("pw").value})});
const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Sign-in failed");location.href="/";}catch(x){er.textContent=x.message;b.disabled=false;}});
</script></body></html>
